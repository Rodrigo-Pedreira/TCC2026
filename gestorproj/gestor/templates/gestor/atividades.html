{% extends "gestor/base.html" %}

{% block title %}Atividades{% endblock %}

{% block content %}
<h1>Atividades</h1>
{% if atividades %}
<ul>
  {% for atividade in atividades %}
  <li>
    <a href="{% url 'gestor:atividade' atividade.nome %}">{{ atividade.nome }}</a>
  </li>
  {% endfor %}
</ul>
{% else %}
<p>Não há atividades cadastradas.</p>
{% endif %}
{% endblock %}
