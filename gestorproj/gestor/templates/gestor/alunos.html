<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <title>Alunos</title>
</head>

<body>
  <h1>Alunos</h1>
  {% if alunos %}
  <ul>
    {% for aluno in alunos %}
    <li><a href="{% url 'gestor:aluno' aluno.ra %}">{{ aluno.nome }}</a></li>
    {% endfor %}
  </ul>
  {% else %}
  <p>Não há alunos cadastrados.</p>
  {% endif %}
</body>

</html>
