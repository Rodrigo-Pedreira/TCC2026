{% extends "gestor/base.html" %}

{% block title %}Alunos{% endblock %}

{% block content %}
<h2 class="m-3">Alunos <span class="badge text-bg-primary rounded-pill">{{ total_alunos }}</span></h2>
<div class="col-md-2 m-3">
  <input type="text" id="search-input" class="form-control" placeholder="Buscar por nome ou RA...">
</div>
<table id="alunos-table" class="table table-striped table-hover w-auto m-3"
  style="--bs-table-hover-bg: rgba(13, 110, 253, 0.15);">
  <thead>
    <tr>
      <th>RA</th>
      <th>Nome</th>
    </tr>
  </thead>
  <tbody class="table-group-divider">
    {% for aluno in alunos %}
    <tr>
      <td class="position-relative"><a class="stretched-link" href="{% url 'gestor:aluno' aluno.ra %}">{{ aluno.ra}}</a>
      </td>
      <td class="position-relative">{{ aluno.nome }}</td>
    </tr>
    {% empty %}
    <tr>
      <td colspan="2">Nenhum aluno encontrado.</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}

{% block extra_js %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/7.0.0/fuse.min.js"></script>
<script>
  function removeAccents(str) {
    return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  document.addEventListener('DOMContentLoaded', function () {
    const table = document.getElementById('alunos-table');
    const rows = Array.from(table.querySelectorAll('tbody tr'))
      .filter(row => row.cells.length >= 2); // skip the "empty" placeholder row

    // Pre-process each row's text once, so search stays fast
    const data = rows.map((row, index) => ({
      index,
      ra: row.cells[0].textContent.trim().toLowerCase(),
      nome: removeAccents(row.cells[1].textContent.trim().toLowerCase()),
    }));

    const fuse = new Fuse(data, {
      keys: ['ra', 'nome'],
      threshold: 0.35,     // 0 = exact match only, 1 = matches almost anything
      ignoreLocation: true // don't care where in the string the match is
    });

    const searchInput = document.getElementById('search-input');
    searchInput.addEventListener('input', function () {
      const query = removeAccents(this.value.trim().toLowerCase());

      if (!query) {
        rows.forEach(r => r.style.display = '');
        return;
      }

      const matched = new Set(fuse.search(query).map(r => r.item.index));
      rows.forEach((row, i) => {
        row.style.display = matched.has(i) ? '' : 'none';
      });
    });
  });
</script>
{% endblock %}
