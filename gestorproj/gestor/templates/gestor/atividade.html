{% extends "gestor/base.html" %}

{% block title %}Atividade {{ atividade.nome }}{% endblock %}

{% block content %}
<h1>Atividade</h1>
<ul>
  <li>
    {{ atividade.nome }} -<br />
    <ul>
      {% for aluno in alunos %}
      <li>
        <a href="{% url 'gestor:aluno' aluno.ra %}">{{ aluno.ra }} - {{ aluno.nome }}</a>
      </li>
      {% endfor %}
    </ul>
  </li>
</ul>
{% endblock %}
